spring.application.name=tech

server.port=7778

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:authuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/authdb}
spring.flyway.user=${SPRING_FLYWAY_USER:authuser}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.expiration-hours=24
