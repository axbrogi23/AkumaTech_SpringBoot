spring:
  datasource:
    url: jdbc:h2:file:./data/akumatech;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
    expiration-ms: 86400000
